<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f7ff"/>
      <stop offset="1" stop-color="#eefbf7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#20304a" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#52657d"/>
    </marker>
  </defs>
  <rect width="1280" height="760" fill="url(#bg)"/>
  <text x="640" y="58" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="32" font-weight="700" fill="#152238">授权版 Skill：用户只安装一次、激活一次</text>
  <text x="640" y="92" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" fill="#5b6b80">公开仓库不放核心明文和私钥；每台电脑拿到不同的专属激活码</text>

  <g filter="url(#shadow)">
    <rect x="55" y="155" width="250" height="250" rx="24" fill="#ffffff"/>
    <rect x="55" y="155" width="250" height="58" rx="24" fill="#3b5ccc"/>
    <rect x="55" y="190" width="250" height="23" fill="#3b5ccc"/>
    <text x="180" y="192" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#fff">1. GitHub 一句话安装</text>
    <text x="82" y="252" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#26354a">公开内容：</text>
    <text x="82" y="285" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#52657d">• 薄 SKILL.md</text>
    <text x="82" y="316" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#52657d">• 跨平台安装脚本</text>
    <text x="82" y="347" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#52657d">• Release 地址与 SHA-256</text>
    <text x="82" y="378" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#cf3f54">没有私钥、没有核心明文</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="355" y="155" width="250" height="250" rx="24" fill="#ffffff"/>
    <rect x="355" y="155" width="250" height="58" rx="24" fill="#168a77"/>
    <rect x="355" y="190" width="250" height="23" fill="#168a77"/>
    <text x="480" y="192" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#fff">2. 本机后台安装</text>
    <text x="382" y="252" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#26354a">自动识别：</text>
    <text x="382" y="285" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#52657d">• Windows / macOS</text>
    <text x="382" y="316" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#52657d">• Intel / Apple Silicon / ARM</text>
    <text x="382" y="347" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#52657d">• 安装本地 MCP 运行器</text>
    <text x="382" y="378" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#168a77">用户不用手工打开 EXE</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="655" y="155" width="250" height="250" rx="24" fill="#ffffff"/>
    <rect x="655" y="155" width="250" height="58" rx="24" fill="#c77a13"/>
    <rect x="655" y="190" width="250" height="23" fill="#c77a13"/>
    <text x="780" y="192" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#fff">3. 首次设备激活</text>
    <text x="682" y="252" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#52657d">电脑生成 HGD1- 请求码</text>
    <path d="M705 279 H855" stroke="#c77a13" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="780" y="310" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#52657d">发给公司</text>
    <text x="682" y="344" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#52657d">公司签发 HGL1- 激活码</text>
    <text x="682" y="378" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#c77a13">一个客户 / 一台电脑 / 一个码</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="955" y="155" width="270" height="250" rx="24" fill="#ffffff"/>
    <rect x="955" y="155" width="270" height="58" rx="24" fill="#7445b8"/>
    <rect x="955" y="190" width="270" height="23" fill="#7445b8"/>
    <text x="1090" y="192" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#fff">4. 以后直接使用</text>
    <text x="982" y="252" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#52657d">用户直接说需求</text>
    <text x="982" y="285" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#52657d">↓ 每次自动校验本机授权</text>
    <text x="982" y="318" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#52657d">↓ 内存解密核心 MD</text>
    <text x="982" y="351" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#52657d">↓ AI 按规则完成任务</text>
    <text x="982" y="384" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#7445b8">不用再次输入激活码</text>
  </g>

  <path d="M305 280 H345" stroke="#52657d" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M605 280 H645" stroke="#52657d" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M905 280 H945" stroke="#52657d" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="110" y="475" width="1060" height="185" rx="28" fill="#152238"/>
    <text x="155" y="525" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#ffffff">核心保护关系</text>
    <text x="155" y="566" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#cbd7e7">核心 Markdown → AES 加密包（GitHub Release）　　运行逻辑 → 编译后的本地运行器</text>
    <text x="155" y="604" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#cbd7e7">客户 A 的 HGL1 码 ≠ 客户 B 的 HGL1 码　　复制到另一台电脑 → DEVICE_MISMATCH</text>
    <text x="155" y="642" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#8fa4bf">一期定位：防直接打开、随手复制和普通转卖；不承诺抵抗管理员内存抓取或专业逆向。</text>
  </g>
  <text x="640" y="716" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#64758b">NewbieCheng Team · social-media-hangge-moments · v1.0.0</text>
</svg>
