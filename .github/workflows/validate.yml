name: Validate marketplace

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate catalog, plugins, skills, UTF-8, and secrets
        env:
          PYTHONUTF8: "1"
        run: python scripts/validate_repository.py

      - name: Run negative and failure-mode tests
        env:
          PYTHONUTF8: "1"
        run: python -m unittest discover -s tests -v

  public-download:
    name: Public no-Git download
    if: github.event_name == 'push' && github.repository == 'NewbieCheng/company-skills-marketplace'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download public archive without Git
        run: |
          python scripts/test_public_download.py \
            --repo NewbieCheng/company-skills-marketplace \
            --ref ${{ github.sha }} \
            --skill-path plugins/social-media-hotspot-brief/skills/hotspot-brief-public
          python scripts/test_public_download.py \
            --repo NewbieCheng/company-skills-marketplace \
            --ref ${{ github.sha }} \
            --skill-path plugins/social-media-hangge-moments/skills/hangge-peng-you-quan-licensed
